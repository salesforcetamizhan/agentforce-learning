<template>
<lightning-card title="Audio Recorder" icon-name="utility:voice_call">

    <div class="slds-p-around_medium">

        <!-- Audio Player -->
        <template if:true={audioURL}>
            <div class="slds-grid slds-grid_vertical-align-center slds-gutters">

                <div class="slds-col slds-grow">
                    <audio controls style="width:100%;">
                        <source src={audioURL} type="audio/webm" />
                    </audio>
                </div>

                   <div class="slds-m-top_medium slds-align_absolute-center">
        <lightning-button
            label="Save Audio"
            variant="brand"
            onclick={saveAudio}
            disabled={disableSaveButton}>
        </lightning-button>
    </div>

            </div>
        </template>

        <!-- Record Button -->
        <template if:false={audioURL}>
        <div class="slds-align_absolute-center slds-m-top_medium">
            <div
                class={recordButtonClass}
                onclick={handleMicClick}
                title={recordTitle}>

                <template if:false={isRecording}>
                    <!-- Microphone -->
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="26"
                        height="26"
                        viewBox="0 0 24 24"
                        fill="#ffffff">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3h-1.5c0 2.48-1.51 4.5-3.5 4.5S8.5 13.48 8.5 11H7c0 2.97 2.16 5.43 5 5.91V21h1v-4.09c2.84-.48 5-2.94 5-5.91z"/>
                    </svg>
                </template>

                <template if:true={isRecording}>
                    <!-- Stop -->
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="#ffffff">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                    </svg>
                </template>

            </div>
        </div>
        </template>
        <!-- Recording Indicator -->
        <template if:true={isRecording}>
            <div class="slds-align_absolute-center slds-m-top_small">
                <lightning-badge label="Recording..."></lightning-badge>
            </div>
        </template>

        <!-- Error -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-m-top_medium">
                {error}
            </div>
        </template>

    </div>

</lightning-card>
</template>
